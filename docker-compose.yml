services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      container_name: vulnwach
      restart: unless-stopped
    env_file:
      - .env

    environment:
      - DB_PATH=/data/vulnwach.sqlite3
    
    volumes:
      - vulnwach_data:/data
    
    read_only: true
    
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    init: true

volumes:
  vulnwach_data:

